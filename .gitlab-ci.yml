# Pipeline SonNuage (serveur + client web)
#  - test        : build + tests du serveur (avec ffmpeg et Elasticsearch)
#  - build       : image Docker du serveur (registre GitLab) ; paquets NuGet SonNuage.Contracts et SonNuage.UI
#                  (registre NuGet du projet), utilisés par l'application Android (dépôt sonnuage-android)
#  - release     : sur tag vX.Y.Z, release GitLab
#
# Les jobs Docker utilisent docker-in-docker : le runner doit être en mode privileged.

stages: [test, build, release]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  SERVER_IMAGE: $CI_REGISTRY_IMAGE

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

.version: &version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then export VERSION="${CI_COMMIT_TAG#v}"; else export VERSION="0.1.0-ci.${CI_PIPELINE_IID}"; fi
    echo "Version $VERSION"

.docker:
  image: docker:28
  services:
    - name: docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

server-test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
      alias: elasticsearch
      variables:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    SONNUAGE_TEST_FFMPEG: /usr/bin/ffmpeg
    SONNUAGE_TEST_ELASTICSEARCH: http://elasticsearch:9200
  cache:
    key: nuget-server
    paths: [.nuget/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
  script:
    - dotnet build src/SonNuage.Server/SonNuage.Server.csproj -c Release
    # Elasticsearch démarre pendant le build ; on l'attend avant les tests (ses tests échouent sinon).
    - for i in $(seq 1 60); do curl -fs "$SONNUAGE_TEST_ELASTICSEARCH/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null && break; sleep 2; done
    - dotnet test --project tests/SonNuage.Server.Tests/SonNuage.Server.Tests.csproj -c Release --report-trx --results-directory TestResults
  artifacts:
    when: always
    paths: [TestResults/]
    expire_in: 1 week

server-image:
  extends: .docker
  stage: build
  needs: [server-test]
  script:
    - *version
    - docker build --build-arg VERSION="$VERSION" -t "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$SERVER_IMAGE:latest"
        docker push "$SERVER_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$SERVER_IMAGE:$VERSION"
        docker push "$SERVER_IMAGE:$VERSION"
      fi

# Bibliothèques partagées avec l'application Android (dépôt sonnuage-android) : SonNuage.Contracts et
# SonNuage.UI, dans le registre NuGet du projet. Version : X.Y.Z sur tag, 0.1.0-ci.N sur les branches.
shared-packages:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs: [server-test]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key: nuget-server
    paths: [.nuget/]
    policy: pull
  script:
    - *version
    - dotnet pack src/SonNuage.Contracts/SonNuage.Contracts.csproj -c Release -o packages -p:Version="$VERSION"
    - dotnet pack src/SonNuage.UI/SonNuage.UI.csproj -c Release -o packages -p:Version="$VERSION"
    - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
        --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - dotnet nuget push "packages/*.nupkg" --source gitlab
  artifacts:
    paths: [packages/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [server-image, shared-packages]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - *version
    - >
      release-cli create --name "SonNuage $VERSION" --tag-name "$CI_COMMIT_TAG"
      --description "Image serveur : \`$SERVER_IMAGE:$VERSION\` · paquets NuGet SonNuage.Contracts et SonNuage.UI $VERSION"
