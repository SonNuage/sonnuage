# Pipeline Localify
#  - test        : build + tests du serveur (avec ffmpeg pour les tests de transcodage)
#  - build       : image Docker du serveur (registre GitLab) et APK Android
#  - release     : sur tag vX.Y.Z, publication de l'APK et création de la release GitLab
#
# Variables CI optionnelles (Settings > CI/CD > Variables, masquées) pour signer l'APK de release :
#   ANDROID_KEYSTORE_BASE64   keystore encodé en base64 (type File interdit : base64 -w0 localify.keystore)
#   ANDROID_KEYSTORE_PASSWORD mot de passe du keystore
#   ANDROID_KEY_ALIAS         alias de la clé
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
# Sans elles l'APK est signé avec une clé de secours générée une fois et gardée dans le cache CI : les builds
# successifs restent installables par-dessus les précédents tant que ce cache vit (une clé régénérée impose de
# désinstaller l'appli). Pour une signature pérenne, définir les variables ci-dessus.
# Un seul APK est publié (dist/localify-X.Y.Z.apk), toujours signé : l'APK non signé que produit aussi
# `dotnet publish` n'est qu'un intermédiaire qu'Android refuse d'installer.
#
# Les jobs Docker utilisent docker-in-docker : le runner doit être en mode privileged.

stages: [prepare, test, build, release]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  SERVER_IMAGE: $CI_REGISTRY_IMAGE
  ANDROID_SDK_IMAGE: $CI_REGISTRY_IMAGE/android-sdk:latest

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

.version: &version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then export VERSION="${CI_COMMIT_TAG#v}"; else export VERSION="0.1.0-ci.${CI_PIPELINE_IID}"; fi
    echo "Version $VERSION"

.docker:
  image: docker:28
  services:
    - name: docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Image de build Android (SDK + workload MAUI), reconstruite seulement quand sa recette change,
# ou à la demande : Run pipeline avec la variable BUILD_ANDROID_SDK=1 (premier pipeline, registre vidé…).
android-sdk-image:
  extends: .docker
  stage: prepare
  rules:
    - if: $BUILD_ANDROID_SDK == "1"
    - changes: [build/android-sdk.Dockerfile]
  script:
    - docker build -f build/android-sdk.Dockerfile -t "$ANDROID_SDK_IMAGE" build
    - docker push "$ANDROID_SDK_IMAGE"

server-test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
      alias: elasticsearch
      variables:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    LOCALIFY_TEST_FFMPEG: /usr/bin/ffmpeg
    LOCALIFY_TEST_ELASTICSEARCH: http://elasticsearch:9200
  cache:
    key: nuget-server
    paths: [.nuget/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
  script:
    - dotnet build src/Localify.Server/Localify.Server.csproj -c Release
    # Elasticsearch démarre pendant le build ; on l'attend avant les tests (ses tests échouent sinon).
    - for i in $(seq 1 60); do curl -fs "$LOCALIFY_TEST_ELASTICSEARCH/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null && break; sleep 2; done
    - dotnet test --project tests/Localify.Server.Tests/Localify.Server.Tests.csproj -c Release --report-trx --results-directory TestResults
  artifacts:
    when: always
    paths: [TestResults/]
    expire_in: 1 week

server-image:
  extends: .docker
  stage: build
  needs: [server-test]
  script:
    - *version
    - docker build --build-arg VERSION="$VERSION" -t "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$SERVER_IMAGE:latest"
        docker push "$SERVER_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$SERVER_IMAGE:$VERSION"
        docker push "$SERVER_IMAGE:$VERSION"
      fi

android-apk:
  stage: build
  image: $ANDROID_SDK_IMAGE
  needs:
    - job: android-sdk-image
      optional: true
  cache:
    key: nuget-android
    paths: [.nuget/, .android-fallback-key/]
  script:
    - *version
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/localify.keystore"
        SIGN_ARGS="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$CI_PROJECT_DIR/localify.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD"
      else
        echo "AVERTISSEMENT : pas de keystore de release, signature avec la clé de secours du cache CI."
        KEY="$CI_PROJECT_DIR/.android-fallback-key/localify-ci.keystore"
        if [ ! -f "$KEY" ]; then
          mkdir -p "$(dirname "$KEY")"
          keytool -genkeypair -keystore "$KEY" -alias localify -keyalg RSA -keysize 2048 -validity 10000             -storepass localify-ci -keypass localify-ci -dname "CN=Localify CI" -noprompt
        fi
        SIGN_ARGS="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$KEY -p:AndroidSigningKeyAlias=localify -p:AndroidSigningStorePass=localify-ci -p:AndroidSigningKeyPass=localify-ci"
      fi
      export SIGN_ARGS
    - dotnet publish src/Localify.Mobile/Localify.Mobile.csproj -f net10.0-android -c Release -o out
        -p:Version="$VERSION" -p:ApplicationVersion="$CI_PIPELINE_IID" $SIGN_ARGS
    - mkdir -p dist && cp out/*-Signed.apk "dist/localify-$VERSION.apk"
    - rm -f "$CI_PROJECT_DIR/localify.keystore"
    # Contrôle : l'APK publié est bien signé (sinon Android refuse de l'installer).
    - $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "dist/localify-$VERSION.apk" | head -3
  artifacts:
    name: localify-android
    paths: [dist/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [server-image, android-apk]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - *version
    - apk add --no-cache curl > /dev/null
    - APK_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/localify-android/${VERSION}/localify-${VERSION}.apk"
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/localify-$VERSION.apk" "$APK_URL"'
    - >
      release-cli create --name "Localify $VERSION" --tag-name "$CI_COMMIT_TAG"
      --description "Image serveur : \`$SERVER_IMAGE:$VERSION\`"
      --assets-link "{\"name\":\"localify-$VERSION.apk\",\"url\":\"$APK_URL\",\"link_type\":\"package\"}"
