# Pipeline SonNuage (serveur + client web)
#  - prepare : image des jobs .NET (SDK, ffmpeg, crane), reconstruite quand build/ci.Dockerfile change. Base
#              d'exécution du serveur (cible base du Dockerfile), reconstruite quand le Dockerfile change
#  - test    : en parallèle, les tests du serveur (avec ffmpeg et Elasticsearch) et l'image Docker du serveur
#              (publiée sous le sha du commit), avec les paquets NuGet SonNuage.Contracts et SonNuage.UI
#  - publish : une fois les tests passés, l'image reçoit ses tags (latest, version) et les paquets NuGet partent
#              dans le registre du projet, pour l'application Android (dépôt sonnuage-android)
#  - release : sur tag vX.Y.Z, release GitLab
#
# Rapidité, sur le runner du homelab :
#  - paquets NuGet dans /nuget, un dossier de la machine monté par le runner (ni zip ni téléversement)
#  - images publiques téléchargées une seule fois (pull_policy if-not-present du runner)
#  - image du serveur assemblée par crane dans le registre : base d'exécution + une couche avec l'application
#    publiée par le job. Ni démon Docker ni téléchargement de la base.
# Les jobs ci-image et runtime-base utilisent docker-in-docker : le runner doit être en mode privileged.

stages: [prepare, test, publish, release]

variables:
  NUGET_PACKAGES: /nuget
  # Verrous NuGet dans le dossier partagé : sinon deux jobs en parallèle extraient le même paquet en même temps.
  NUGET_SCRATCH: /nuget/.scratch
  SERVER_IMAGE: $CI_REGISTRY_IMAGE
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  RUNTIME_BASE: $CI_REGISTRY_IMAGE/runtime-base:latest
  GIT_DEPTH: "10"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: fastest

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

.version: &version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then export VERSION="${CI_COMMIT_TAG#v}"; else export VERSION="0.1.0-ci.${CI_PIPELINE_IID}"; fi
    echo "Version $VERSION"

.dind:
  services:
    - name: docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

# Image de nos jobs, toujours vérifiée auprès du registre (latest peut avoir été reconstruite).
.dotnet:
  image:
    name: $CI_IMAGE
    pull_policy: always
  needs:
    - job: ci-image
      optional: true

.registry-login: &registry-login
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Reconstruite quand sa recette change, ou à la demande : Run pipeline avec BUILD_CI_IMAGE=1.
ci-image:
  extends: .dind
  stage: prepare
  image: docker:28
  rules:
    - if: $BUILD_CI_IMAGE == "1"
    # Sur push seulement : hors push (pipeline manuelle, planifiée), changes est toujours vrai.
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: [build/ci.Dockerfile]
  script:
    - *registry-login
    - docker build --pull -f build/ci.Dockerfile -t "$CI_IMAGE" build
    - docker push "$CI_IMAGE"

# Base d'exécution (ASP.NET, ffmpeg, yt-dlp, Deno, fpcalc), reconstruite quand le Dockerfile change,
# ou à la demande : Run pipeline avec BUILD_RUNTIME_BASE=1 (mises à jour de sécurité de l'image ASP.NET).
runtime-base:
  extends: .dind
  stage: prepare
  image: docker:28
  rules:
    - if: $BUILD_RUNTIME_BASE == "1"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: [Dockerfile]
  script:
    - *registry-login
    - docker build --pull --target base -t "$RUNTIME_BASE" .
    - docker push "$RUNTIME_BASE"

server-test:
  extends: .dotnet
  stage: test
  services:
    - name: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
      alias: elasticsearch
      variables:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    SONNUAGE_TEST_FFMPEG: /usr/bin/ffmpeg
    SONNUAGE_TEST_ELASTICSEARCH: http://elasticsearch:9200
  script:
    # Le projet de tests compile aussi le serveur : une seule compilation.
    - dotnet build tests/SonNuage.Server.Tests/SonNuage.Server.Tests.csproj -c Release
    # Elasticsearch démarre pendant le build. On l'attend avant les tests (ses tests échouent sinon).
    - for i in $(seq 1 60); do curl -fs "$SONNUAGE_TEST_ELASTICSEARCH/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null && break; sleep 2; done
    - dotnet test --project tests/SonNuage.Server.Tests/SonNuage.Server.Tests.csproj -c Release --no-build --report-trx --results-directory TestResults
  artifacts:
    when: always
    paths: [TestResults/]
    expire_in: 1 week

# En parallèle des tests : publication, image sous le sha du commit, paquets NuGet (poussés après les tests).
server-image:
  extends: .dotnet
  stage: test
  needs:
    - job: ci-image
      optional: true
    - job: runtime-base
      optional: true
  script:
    - *version
    - dotnet publish src/SonNuage.Server/SonNuage.Server.csproj -c Release -o publish -p:Version="$VERSION" -p:UseAppHost=false
    - dotnet pack src/SonNuage.Contracts/SonNuage.Contracts.csproj -c Release -o packages -p:Version="$VERSION"
    - dotnet pack src/SonNuage.UI/SonNuage.UI.csproj -c Release -o packages -p:Version="$VERSION"
    # Image = base d'exécution + l'application dans /app, assemblée directement dans le registre.
    - mkdir -p layer && mv publish layer/app
    - tar -C layer --owner=0 --group=0 --numeric-owner -cf app.tar app
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane append -b "$RUNTIME_BASE" -f app.tar -t "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    paths: [packages/]
    expire_in: 30 days

# Tests passés : tags latest (branche principale) et version (tag Git), sans rien retélécharger.
server-image-tags:
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  needs: [server-test, server-image]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - *version
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then crane tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" latest; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then crane tag "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$VERSION"; fi

# Bibliothèques partagées avec l'application Android (dépôt sonnuage-android) : SonNuage.Contracts et
# SonNuage.UI, dans le registre NuGet du projet. Version : X.Y.Z sur tag, 0.1.0-ci.N sur les branches.
shared-packages:
  extends: .dotnet
  stage: publish
  needs: [server-test, server-image]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
        --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - dotnet nuget push "packages/*.nupkg" --source gitlab

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [server-image-tags, shared-packages]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - *version
    - >
      release-cli create --name "SonNuage $VERSION" --tag-name "$CI_COMMIT_TAG"
      --description "Image serveur : \`$SERVER_IMAGE:$VERSION\` · paquets NuGet SonNuage.Contracts et SonNuage.UI $VERSION"
